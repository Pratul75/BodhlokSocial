name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bodh
          POSTGRES_PASSWORD: bodh
          POSTGRES_DB: bodh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bodh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bodh:bodh@localhost:5433/bodh
      DEV_USER_EMAIL: kshitij@rechargestudio.com
      WORKER_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the schema
        run: |
          pnpm --filter @bodh/db exec drizzle-kit generate --name ci-check
          test -z "$(git status --porcelain packages/db/migrations)" || (git status --porcelain packages/db/migrations && echo "Schema changed without a migration. Run pnpm db:generate and commit it." && exit 1)
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
        env:
          BOOTSTRAP_ADMIN_EMAIL: kshitij@rechargestudio.com
      - run: pnpm db:seed
        env:
          SEED_CONFIRM: "yes"
      - run: pnpm lint
      - run: pnpm check:schedules
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bodh/web build
      - name: End-to-end smoke tests (dev sign-in, seeded database)
        run: |
          pnpm --filter @bodh/web exec playwright install --with-deps chromium
          pnpm --filter @bodh/web e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the web and worker images
        run: |
          docker build --target web -t bodh-web:ci .
          docker build --target worker -t bodh-worker:ci .
      - name: The worker refuses the example token in production
        run: |
          out=$(docker run --rm -e NODE_ENV=production -e WORKER_TOKEN=change-me-dev-token bodh-worker:ci 2>&1 || true)
          echo "$out" | grep -q "placeholder" || (echo "$out"; exit 1)

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
