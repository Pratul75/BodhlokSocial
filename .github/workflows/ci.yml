name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bodh
          POSTGRES_PASSWORD: bodh
          POSTGRES_DB: bodh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bodh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bodh:bodh@localhost:5433/bodh
      DEV_USER_EMAIL: kshitij@rechargestudio.com
      WORKER_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the schema
        run: |
          pnpm --filter @bodh/db exec drizzle-kit generate --name ci-check
          test -z "$(git status --porcelain packages/db/migrations)" || (git status --porcelain packages/db/migrations && echo "Schema changed without a migration. Run pnpm db:generate and commit it." && exit 1)
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
        env:
          BOOTSTRAP_ADMIN_EMAIL: kshitij@rechargestudio.com
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bodh/web build
