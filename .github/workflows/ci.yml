name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bodh
          POSTGRES_PASSWORD: bodh
          POSTGRES_DB: bodh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bodh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bodh:bodh@localhost:5433/bodh
      DEV_USER_EMAIL: kshitij@rechargestudio.com
      WORKER_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bodh/db exec drizzle-kit push --force
      - run: pnpm --filter @bodh/db exec tsx src/seed.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bodh/web build
